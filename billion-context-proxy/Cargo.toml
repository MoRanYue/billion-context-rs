[package]
name = "billion-context-proxy"
# First published version of the host binary. It follows the workspace minor
# line because its `billion-context` requirement moves with it.
version = "0.1.0"
description = "Rust host for billion-context: OpenAI/Anthropic proxy, plugin API and admin panel"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"
billion-context = { version = "0.7.0", path = "../billion-context", features = ["serde"] }
billion-context-tool = { version = "0.7.0", path = "../billion-context-tool" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
