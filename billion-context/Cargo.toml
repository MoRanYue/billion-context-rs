[package]
name = "billion-context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Lossless-tiered context compression for LLM agents: stable refs, blocks, two-pass fold protocol"
keywords = ["llm", "context-window", "compression", "agent", "tokens"]
categories = ["text-processing", "algorithms"]
readme = "README.md"
# The differential harnesses replay scenario files that belong to the
# TypeScript kernel, so they are dev-only and would not build from the package.
exclude = ["examples/diff_harness.rs", "examples/tok_diff.rs"]

[dependencies]
serde = { workspace = true, optional = true }
# `persist` serialises snapshots as JSON, so the feature needs a JSON codec of
# its own; leaving it in dev-dependencies made `--features serde` unbuildable
# for every downstream crate.
serde_json = { workspace = true, optional = true }
# Only with `hf-tokenizer`: a real BPE vocabulary instead of the char heuristic.
# Both are optional so the default build stays dependency-free.
tokenizers = { version = "0.23", optional = true }
deepseek-recipe-encoding = { version = "0.2", optional = true }

[dev-dependencies]
# Also a regular (optional) dependency: `persist` needs it at runtime under the
# `serde` feature. Kept here as well because the differential examples parse
# JSON regardless of features.
serde_json = { workspace = true }

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
# Exact counting from a HuggingFace `tokenizer.json`, encoded by DeepSeek's
# `deepseek-recipe-encoding`. Costs a tokenizer stack and a multi-MB vocabulary
# at runtime, so it is opt-in. Side effect worth knowing: that crate enables
# `serde_json/preserve_order` for the whole dependency graph, which changes
# `serde_json::Value`'s map type process-wide.
hf-tokenizer = ["dep:tokenizers", "dep:deepseek-recipe-encoding"]

[[test]]
name = "hf_tokenizer"
path = "tests/hf_tokenizer.rs"
required-features = ["hf-tokenizer"]
