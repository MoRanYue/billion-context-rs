[workspace]
resolver = "3"
members = ["billion-context", "billion-context-wire", "billion-context-tool"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/MoRanYue/billion-context-rs"
homepage = "https://github.com/MoRanYue/billion-context-rs"
authors = ["MoRanYue <moranyue@echonet.icu>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
